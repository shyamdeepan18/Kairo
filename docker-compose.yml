# Production compose — customer Windows Server (Docker Desktop / WSL2).
# Usage:  copy .env.example .env  →  set secrets  →  docker compose up -d --build
# Env vars are read from .env in this directory.
# (The obsolete top-level `version:` key is intentionally omitted.)

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-erp_db}
      POSTGRES_USER: ${POSTGRES_USER:-erp}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      TZ: ${TZ:-Asia/Kolkata}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-erp} -d ${POSTGRES_DB:-erp_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging: *default-logging

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]   # persist permission cache across restarts
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging: *default-logging

  # One-shot DB bootstrap: create/upgrade schema, then exit. API waits for success.
  # DB_BOOTSTRAP=migrate (default; needs committed migrations) or =push (greenfield).
  migrate:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: migrate
    restart: "no"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-erp}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-erp_db}
      DB_BOOTSTRAP: ${DB_BOOTSTRAP:-migrate}
      TZ: ${TZ:-Asia/Kolkata}
    depends_on:
      postgres:
        condition: service_healthy
    logging: *default-logging

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: runner
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-erp}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-erp_db}
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      JWT_ACCESS_EXPIRES_IN: ${JWT_ACCESS_EXPIRES_IN:-15m}
      REFRESH_TOKEN_EXPIRES_DAYS: ${REFRESH_TOKEN_EXPIRES_DAYS:-7}
      NODE_ENV: production
      API_PORT: 3000
      API_HOST: 0.0.0.0
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost}
      TZ: ${TZ:-Asia/Kolkata}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    expose:
      - "3000"            # internal only — nginx proxies it
    logging: *default-logging

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        VITE_API_BASE_URL: /api
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"   # set HTTP_PORT=8080 if IIS owns port 80
    depends_on:
      api:
        condition: service_healthy
    logging: *default-logging

  # Nightly pg_dump to ./backups (host bind mount), 14-day retention.
  backup:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD}
      TZ: ${TZ:-Asia/Kolkata}
    volumes:
      - ./backups:/backups
    entrypoint:
      - sh
      - -c
      - >
        while true; do
          pg_dump -h postgres -U ${POSTGRES_USER:-erp} -d ${POSTGRES_DB:-erp_db}
            -F c -f /backups/erp_$$(date +%Y%m%d_%H%M%S).dump || echo "backup failed";
          find /backups -name '*.dump' -mtime +14 -delete;
          sleep 86400;
        done
    depends_on:
      postgres:
        condition: service_healthy
    logging: *default-logging

volumes:
  postgres_data:
  redis_data:
